version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms_springboot}
      POSTGRES_USER: ${POSTGRES_USER:-hrms_spring}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hrms_spring} -d $${POSTGRES_DB:-hrms_springboot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hrms-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hrms-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hrms_springboot}
      DB_USERNAME: ${POSTGRES_USER:-hrms_spring}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_password}
      HRMS_DEFAULT_USER_PASSWORD: ${HRMS_DEFAULT_USER_PASSWORD:-AdminPass123!}
      HRMS_TIMEZONE: ${HRMS_TIMEZONE:-Asia/Kolkata}
      PORT: 8080
    networks:
      - hrms-network

networks:
  hrms-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
