# Spring Boot Application Configuration for HRMS
# Database: hrms_springboot (separate from old hrms_db - completely isolated)

spring:
  application:
    name: hrms-app
  config:
    import: optional:file:.env[.properties]
  
  # Database Configuration — SEPARATE from old Python project's hrms_db
  # Old database (hrms_db) remains untouched
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hrms_springboot}
    username: ${DB_USERNAME:hrms_spring}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway handles schema management, not Hibernate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          use_scrollable_resultset: true
        order_inserts: true
        order_updates: true
  
  # Flyway Database Migrations
  # These will run automatically on startup
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true
    validate-on-migrate: true

  # Spring Session JDBC Configuration (Section 6.1 & 7.1)
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

# Server Configuration
server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
  compression:
    enabled: true
    min-response-size: 1024

# HRMS Custom Security & Session Settings (Section 6.1)
hrms:
  session:
    absolute-timeout-hours: ${HRMS_SESSION_ABSOLUTE_TIMEOUT_HOURS:8}
  seed:
    enabled: ${HRMS_SEED_ENABLED:true}
  demo-hints:
    enabled: ${HRMS_DEMO_HINTS_ENABLED:true}
  security:
    default-initial-password: ${HRMS_DEFAULT_USER_PASSWORD}
  attendance:
    finalizer-cron: ${HRMS_ATTENDANCE_FINALIZER_CRON:0 59 23 * * MON-FRI}

# Logging Configuration
logging:
  level:
    root: INFO
    com.hrms: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%-5level] %logger{36} - %msg%n"
  file:
    name: logs/hrms.log
    max-size: 10MB
    max-history: 30
