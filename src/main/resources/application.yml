# Spring Boot Application Configuration for HRMS
# Database: hrms_springboot (separate from old hrms_db - completely isolated)

spring:
  application:
    name: hrms-app
  
  # Database Configuration — SEPARATE from old Python project's hrms_db
  # Old database (hrms_db) remains untouched
  datasource:
    url: jdbc:postgresql://localhost:5432/hrms_springboot
    username: hrms_spring
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
  
  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: validate  # Flyway handles schema management, not Hibernate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          batch_size: 20
          fetch_size: 50
          use_scrollable_resultset: true
        order_inserts: true
        order_updates: true
  
  # Flyway Database Migrations
  # These will run automatically on startup
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration
    enabled: true
    validate-on-migrate: true

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

# Logging Configuration
logging:
  level:
    root: INFO
    com.hrms: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%-5level] %logger{36} - %msg%n"
  file:
    name: logs/hrms.log
    max-size: 10MB
    max-history: 30
