<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change Password')}"></head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

<header th:replace="~{fragments/layout :: navbar('account')}"></header>

<main class="max-w-xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

    <div th:if="${successMessage}" class="p-4 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-800 font-medium"
         th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="p-4 rounded-lg bg-red-50 border border-red-200 text-sm text-red-800 font-medium"
         th:text="${errorMessage}"></div>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-5">
        <div class="border-b border-slate-200 pb-4">
            <h1 class="text-lg font-bold text-slate-900">Change Account Password</h1>
            <p class="text-xs text-slate-500 mt-1">
                Rotate your password regularly. Password updates are recorded under <code class="font-mono">PASSWORD_CHANGED</code> without storing secrets in audit logs.
            </p>
            <div class="mt-3 flex flex-wrap items-center gap-3 text-xs text-slate-600">
                <span>Account: <strong class="font-mono text-slate-800" th:text="${accountEmail}">user@company.com</strong></span>
                <span th:if="${passwordResetAt != null}">
                    · Last changed: <span class="font-mono text-slate-700" th:text="${@timeFmt.formatInstant(passwordResetAt, 'dd MMM yyyy, hh:mm a')}">Never</span>
                </span>
                <span th:if="${passwordResetAt == null}">
                    · Last changed: <span class="text-amber-700 font-semibold">Initial / Not yet rotated</span>
                </span>
            </div>
        </div>

        <form th:action="@{/account/password}" th:object="${passwordForm}" method="post" class="space-y-4">
            <div>
                <label for="currentPassword" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
                    Current Password *
                </label>
                <input id="currentPassword" type="password" th:field="*{currentPassword}" required autocomplete="current-password"
                       class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none"/>
                <p th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <div>
                <label for="newPassword" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
                    New Password (min 8 characters) *
                </label>
                <input id="newPassword" type="password" th:field="*{newPassword}" required minlength="8" autocomplete="new-password"
                       class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none"/>
                <p th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <div>
                <label for="confirmPassword" class="block text-xs font-semibold uppercase text-slate-600 mb-1">
                    Confirm New Password *
                </label>
                <input id="confirmPassword" type="password" th:field="*{confirmPassword}" required minlength="8" autocomplete="new-password"
                       class="w-full px-3.5 py-2 text-sm rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none"/>
                <p th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}" class="text-xs text-red-600 mt-1"></p>
            </div>

            <div class="pt-3 flex justify-end space-x-3">
                <a th:href="@{/dashboard}"
                   class="px-4 py-2 text-xs font-semibold text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-lg transition">
                    Cancel
                </a>
                <button type="submit"
                        class="px-5 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition">
                    Update Password
                </button>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
