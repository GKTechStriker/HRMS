<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password — Enterprise HRMS</title>
    <script>
        const storedTheme = localStorage.getItem('hrms-theme') ||
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            900: '#312e81'
                        }
                    }
                }
            }
        };
    </script>
    <link rel="stylesheet" th:href="@{/css/main.css}"/>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" crossorigin="anonymous" defer></script>
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-xl border border-slate-200/80 dark:border-slate-800 p-8 space-y-6">

    <!-- Header & Logo -->
    <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-950/60 border border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 mb-2">
            <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 dark:text-white">Recover Password</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400">
            Enter your registered work email and we will send you a secure link to reset your account credentials.
        </p>
    </div>

    <!-- Alert Banners -->
    <div th:if="${infoMessage}" class="p-3.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-800 dark:text-emerald-300 font-medium flex items-start gap-2.5">
        <i data-lucide="check-circle-2" class="w-4 h-4 shrink-0 mt-0.5 text-emerald-600 dark:text-emerald-400"></i>
        <span th:text="${infoMessage}">Instructions dispatched.</span>
    </div>

    <div th:if="${errorMessage}" class="p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-xs text-rose-800 dark:text-rose-300 font-medium flex items-start gap-2.5">
        <i data-lucide="alert-circle" class="w-4 h-4 shrink-0 mt-0.5 text-rose-600 dark:text-rose-400"></i>
        <span th:text="${errorMessage}">Invalid request.</span>
    </div>

    <!-- Form -->
    <form th:action="@{/forgot-password}" method="post" class="space-y-4">
        <div>
            <label for="email" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-400 mb-1.5">
                Work Email Address
            </label>
            <div class="relative">
                <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i data-lucide="mail" class="w-4 h-4"></i>
                </span>
                <input id="email" name="email" type="email" required autofocus
                       placeholder="employee@company.com"
                       class="w-full pl-10 pr-3.5 py-2.5 text-sm rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent transition"/>
            </div>
        </div>

        <button type="submit"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-sm rounded-xl shadow-sm shadow-indigo-600/20 flex items-center justify-center gap-2 transition">
            <span>Send Password Reset Link</span>
            <i data-lucide="send" class="w-4 h-4"></i>
        </button>
    </form>

    <!-- Footer Back Link -->
    <div class="text-center pt-2 border-t border-slate-100 dark:border-slate-800">
        <a th:href="@{/login}" class="inline-flex items-center gap-1.5 text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:text-indigo-700 dark:hover:text-indigo-300 transition">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Return to Workspace Sign In</span>
        </a>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (window.lucide) {
            window.lucide.createIcons();
        }
    });
</script>
</body>
</html>
